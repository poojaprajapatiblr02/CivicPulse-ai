[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=app --cov=../data/scripts --cov-report=term-missing --cov-fail-under=80
markers =
	recommendations_live: Opt-in BigQuery recommendation writes using mocked Gemini, retaining one synthetic test recommendation
	hotspots_live: Explicit opt-in BigQuery snapshot writes; restores configured threshold and never changes requests
	integration: Explicit opt-in tests requiring live BigQuery and local generated CSV files
	gemini_live: Explicit opt-in tests making billable Vertex AI Gemini calls
	requests_live: Explicit opt-in tests making billable Gemini calls and retaining synthetic BigQuery requests